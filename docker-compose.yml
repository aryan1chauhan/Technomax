version: "3.9"

services:

  db:
    image: postgres:15
    container_name: mediroute_db
    environment:
      POSTGRES_DB: mediroute
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mediroute_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: mediroute_backend
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/mediroute
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      ORS_API_KEY: ${ORS_API_KEY}
      FIREBASE_SERVICE_ACCOUNT_PATH: /app/firebase-service-account.json
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/ml_training:/app/ml_training
      - ./backend/firebase-service-account.json:/app/firebase-service-account.json:ro

  frontend:
    build: ./frontend
    container_name: mediroute_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pg_data:
  redis_data:
